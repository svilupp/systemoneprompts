title = "Conformance seed"
version = "1"

[data]
labels = { billing = "Billing", orders = "Orders" }
variants = ["first", "second"]

[data.nested]
message = """
Application-owned text stays outside the provider questions.
"""

[requires]
"ticket.message" = "string"

[questions.topic]
type = "choice"
criteria.billing = "Billing"
criteria.orders = "Orders"

[questions.urgent]
type = "noul"

[factors]
"billing" = { ref = "topic", choice = "billing" }
"urgent_enough" = { ref = "urgent", noul = { gte = 0.5 } }
"route" = { all = ["billing", "urgent_enough"] }
