name: typescript

on:
  push:
    branches: [main]
  pull_request:

defaults:
  run:
    working-directory: packages/typescript

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: sh scripts/run-quiet.sh "Checks" -- bun run check
      - run: sh scripts/run-quiet.sh "Package smoke" -- bun run test:package

  node-import:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: sh scripts/run-quiet.sh "Build" -- bun run build
      - run: sh scripts/run-quiet.sh "npm pack" -- npm pack --ignore-scripts
